<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FFF6EC">
<meta name="robots" content="noindex">
<title>Сайт обновлён · Солнечный план Дарьи</title>
<link rel="canonical" href="https://daria.vosiev.com">
<!-- через 6 секунд мягко перенаправим на новый сайт -->
<meta http-equiv="refresh" content="6; url=https://daria.vosiev.com">
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--cream:#FFF6EC;--card:#FFFDFA;--sun:#F6B53D;--sun-soft:#FCE2A8;--sun-deep:#B07F1F;--sage:#8AA978;--ink:#4A3F35;--ink-soft:#8C7E70;--line:#EFE4D4}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;background:radial-gradient(120% 90% at 50% -10%,var(--sun-soft) 0%,var(--cream) 60%);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:24px;overflow:hidden}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:40px 30px;max-width:440px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(246,181,61,.22);position:relative;z-index:1;animation:pop .6s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
h1{font-family:'Comfortaa',cursive;font-size:1.6rem;margin:18px 0 8px}
.accent{color:var(--sun)}
p{color:var(--ink-soft);font-size:1.05rem;line-height:1.6;margin-bottom:8px}
.btn{display:inline-flex;align-items:center;gap:8px;margin-top:20px;border:none;cursor:pointer;border-radius:16px;padding:15px 26px;font-family:'Nunito',sans-serif;font-weight:800;font-size:1.05rem;color:#fff;background:var(--sun);box-shadow:0 8px 22px rgba(246,181,61,.4);text-decoration:none;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(246,181,61,.55)}
.alt{display:block;margin-top:14px;font-size:.85rem;color:var(--ink-soft)}
.alt a{color:var(--sun-deep);font-weight:700}
.count{margin-top:16px;font-size:.82rem;color:var(--ink-soft)}
.sun-svg{width:96px;height:96px;display:block;margin:0 auto}
.sun-svg .rays{transform-box:fill-box;transform-origin:center;animation:spin 28s linear infinite}
.sun-svg .halo{transform-box:fill-box;transform-origin:center;animation:halo 4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes halo{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.5;transform:scale(1.12)}}
.motes{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.motes i{position:absolute;bottom:-12px;width:8px;height:8px;border-radius:50%;background:radial-gradient(circle,#FCE2A8,#F6B53D);opacity:.6;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}12%{opacity:.7}100%{transform:translateY(-100vh) scale(1);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="motes" id="motes" aria-hidden="true"></div>
<div class="card">
  <svg class="sun-svg" viewBox="0 0 120 120" role="img" aria-label="Солнышко">
    <defs><radialGradient id="sg" cx="38%" cy="34%" r="70%"><stop offset="0%" stop-color="#FFE48F"/><stop offset="100%" stop-color="#F6B53D"/></radialGradient></defs>
    <circle class="halo" cx="60" cy="60" r="34" fill="#F6B53D"/>
    <g class="rays" fill="#F6B53D"><rect x="57" y="6" width="6" height="15" rx="3"/><rect x="57" y="6" width="6" height="15" rx="3" transform="rotate(30 60 60)"/><rect x="57" y="6" width="6" height="15" rx="3" transform="rotate(60 60 60)"/><rect x="57" y="6" width="6" height="15" rx="3" transform="rotate(90 60 60)"/><rect x="57" y="6" width="6" height="15" rx="3" transform="rotate(120 60 60)"/><rect x="57" y="6" width="6" height="15" rx="3" transform="rotate(150 60 60)"/><rect x="57" y="6" width="6" height="15" rx="3" transform="rotate(180 60 60)"/><rect x="57" y="6" width="6" height="15" rx="3" transform="rotate(210 60 60)"/><rect x="57" y="6" width="6" height="15" rx="3" transform="rotate(240 60 60)"/><rect x="57" y="6" width="6" height="15" rx="3" transform="rotate(270 60 60)"/><rect x="57" y="6" width="6" height="15" rx="3" transform="rotate(300 60 60)"/><rect x="57" y="6" width="6" height="15" rx="3" transform="rotate(330 60 60)"/></g>
    <circle cx="60" cy="60" r="24" fill="url(#sg)"/>
  </svg>
  <h1>Сайт <span class="accent">обновлён</span> ✨</h1>
  <p>«Солнечный план Дарьи» переехал на новый адрес — там свежий дизайн, забота о смене и перекусах, заметки и тёплый ИИ-помощник «Луч» 💛</p>
  <a class="btn" href="https://daria.vosiev.com">Перейти на новый сайт ☀️</a>
  <span class="alt">или открой: <a href="https://daria.vosiev.com">daria.vosiev.com</a> · <a href="https://lecheniya-app.vercel.app">lecheniya-app.vercel.app</a></span>
  <div class="count" id="count">Перенаправляю автоматически через 6 секунд…</div>
</div>
<script>
// освобождаем старый кэш и сервис-воркер этого первого сайта,
// чтобы у всех точно открывалась новая версия
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister()})}).catch(function(){});
}
if(window.caches&&caches.keys){caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k)})}).catch(function(){});}
// плавающие солнечные частицы
(function(){var m=document.getElementById('motes');if(!m)return;for(var i=0;i<16;i++){var d=document.createElement('i');d.style.left=(Math.random()*100)+'%';d.style.animationDuration=(7+Math.random()*7)+'s';d.style.animationDelay=(-Math.random()*12)+'s';var s=(5+Math.random()*5).toFixed(1)+'px';d.style.width=s;d.style.height=s;m.appendChild(d);}})();
// обратный отсчёт + надёжный редирект (на случай, если meta-refresh заблокирован)
var left=6,el=document.getElementById('count');
var t=setInterval(function(){left--;if(el)el.textContent='Перенаправляю автоматически через '+left+' сек…';if(left<=0){clearInterval(t);location.replace('https://daria.vosiev.com');}},1000);
</script>
</body>
</html>
